name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # A clean runner is the point: it proves the install line in the README
    # works on a machine that has never seen this project.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Test
        run: pytest tests/ -q

  figure:
    # The README's hero image points readers at a script. Nothing ran it, so a
    # sciglyph API change would have rotted the figure silently. This does not
    # touch the package's dependencies - matplotlib and sciglyph are installed
    # only for this job.
    name: the README figure script still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install sciglyph
      - name: Regenerate the figure
        run: |
          python docs/three-states_figure.py
          python - <<'EOF'
          import pathlib, struct
          p = pathlib.Path("docs/three-states.png")
          assert p.stat().st_size > 20_000, f"figure is suspiciously small: {p.stat().st_size} bytes"
          d = p.read_bytes()
          assert d[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          w, h = struct.unpack(">II", d[16:24])
          assert w > 500 and h > 200, f"figure has an implausible size: {w}x{h}"
          print(f"regenerated {p}: {w}x{h}, {p.stat().st_size} bytes")
          EOF
