[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarcheck"
version = "0.1.3"
description = "Is this claim already taken, who extended it, and do your citations exist - literature grounding from the command line. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Guo Cheng" }]
keywords = ["citations", "bibtex", "openalex", "crossref", "arxiv",
            "literature-review", "hallucination", "research-tools", "doi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
scholarcheck = "scholarcheck.cli:main"

[project.urls]
Homepage = "https://github.com/GuoCheng24/scholarcheck"
Issues = "https://github.com/GuoCheng24/scholarcheck/issues"

[tool.setuptools.packages.find]
include = ["scholarcheck*"]
